<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>捡漏助手</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar app-topbar">
        <a class="brand" href="/" aria-label="捡漏助手首页">
          <span class="brand-mark" aria-hidden="true">QZ</span>
          <span><small>我去图书馆</small><strong>捡漏助手</strong></span>
        </a>
        <div class="top-actions">
          <span class="status-pill" id="healthStatus"><i></i>检测中</span>
          <span class="user-chip"><b id="userAvatar">U</b><span id="userStatus">未登录</span></span>
          <a class="icon-link admin-only" id="adminLink" href="/admin.html" title="管理后台" hidden>管理</a>
          <button class="quiet-button" id="logoutBtn" type="button">退出</button>
        </div>
      </header>

      <section class="view view-active" id="view-home" aria-label="首页">
        <section class="balance-panel reveal-item">
          <div>
            <p class="eyebrow">头发账户</p>
            <div class="balance-value"><strong id="hairBalance">0</strong><span>根头发</span></div>
          </div>
          <span class="checkin-state" id="checkinState">今日可签到</span>
        </section>

        <section class="hero-panel reveal-item" id="monitorPanel">
          <div class="monitor-head">
            <div>
              <p class="eyebrow" id="modeText">捡漏监控</p>
              <div class="countdown" id="countdown">READY</div>
              <p class="subline" id="stateText">请先保存配置</p>
            </div>
            <div class="signal-badge"><i></i><span>服务在线</span></div>
          </div>
          <div class="primary-action">
            <button class="primary" id="leakBtn" type="button">开始捡漏</button>
            <small>成功抢座后消耗 1 根头发</small>
          </div>
          <div class="quick-actions">
            <button class="checkin-button" id="checkinBtn" type="button">签到领头发</button>
            <button class="danger" id="stopBtn" type="button">停止</button>
          </div>
        </section>

        <section class="notice-panel reveal-item" id="noticePanel" hidden>
          <div class="panel-title"><span class="notice-dot"></span><h2>公告</h2></div>
          <ol id="noticeList"></ol>
        </section>

        <section class="summary-grid reveal-item">
          <div class="summary-item"><span>阅览室</span><strong id="summaryLib">未配置</strong></div>
          <div class="summary-item"><span>Cookie</span><strong id="summaryCookie">未配置</strong></div>
          <div class="summary-item admin-only" hidden><span>轮询间隔</span><strong id="summaryOpenTime">1.5 秒</strong></div>
          <div class="summary-item admin-only" hidden><span>请求次数</span><strong id="summaryRounds">0</strong></div>
        </section>
      </section>

      <section class="view" id="view-config" aria-label="配置">
        <header class="section-header">
          <div><p class="eyebrow">SETTINGS</p><h1>抢座配置</h1></div>
          <button id="testConfigBtn" type="button">测试连接</button>
        </header>
        <form class="form settings-panel" id="configForm">
          <section class="login-panel">
            <div><span class="label-title">登录获取 Cookie</span><small>完成微信授权后，将跳转链接粘贴到下方解析。</small></div>
            <div class="actions compact">
              <button class="primary" id="openWechatLoginBtn" type="button">打开微信登录</button>
              <button id="copyLoginLinkBtn" type="button">复制登录链接</button>
            </div>
          </section>
          <label><span>微信回调链接</span><textarea id="authUrlInput" rows="3" placeholder="粘贴包含 code 的完整回调链接"></textarea></label>
          <div class="actions compact">
            <button class="primary" id="exchangeCookieBtn" type="button">解析登录并获取阅览室</button>
            <button id="refreshRoomsBtn" type="button">刷新阅览室</button>
          </div>
          <label><span>Cookie</span><textarea id="cookieInput" rows="4" placeholder="wechatSESS_ID=xxx; SERVERID=xxx"></textarea><small>仅保存在当前浏览器中。</small></label>
          <label><span>Authorization</span><input id="authorizationInput" type="text" placeholder="Bearer xxx，可留空" /></label>
          <label><span>阅览室</span><select id="roomSelect"><option value="">请先登录并获取阅览室</option></select><small id="roomHint">登录后会自动读取可用阅览室。</small></label>
          <label class="advanced-field"><span>阅览室 ID</span><input id="libIdInput" type="number" min="1" inputmode="numeric" placeholder="自动选择后填入" /></label>
          <div class="form-row admin-only" hidden>
            <label><span>捡漏间隔</span><input id="slowIntervalInput" type="number" min="1" step="0.5" value="1.5" /><small>秒</small></label>
            <label><span>每轮提交</span><input id="concurrencyInput" type="number" min="1" max="1" step="1" value="1" /><small>固定串行</small></label>
          </div>
          <div class="form-row admin-only" hidden>
            <label><span>每轮候选</span><input id="candidateLimitInput" type="number" min="1" max="3" step="1" value="1" /></label>
            <label><span>失败冷却</span><input id="cooldownInput" type="number" min="3" max="30" step="1" value="8" /><small>秒</small></label>
          </div>
          <div class="form-row">
            <label><span>偏好座位</span><input id="preferredSeatsInput" type="text" placeholder="如 101,102,103" /></label>
            <label><span>验证码</span><input id="captchaInput" type="text" placeholder="通常留空" /></label>
          </div>
          <label><span>ntfy.sh 频道</span><input id="ntfyInput" type="text" placeholder="可选，例如 my-seat-topic" /></label>
          <div class="actions compact form-actions">
            <button class="primary" id="saveBtn" type="submit">保存配置</button>
            <button id="clearCookieBtn" type="button">清除登录</button>
          </div>
        </form>
      </section>

      <section class="view" id="view-logs" aria-label="日志">
        <header class="section-header">
          <div><p class="eyebrow">ACTIVITY</p><h1>运行日志</h1></div>
          <button id="clearLogsBtn" type="button">清空</button>
        </header>
        <ol class="log-list" id="logList"></ol>
      </section>
    </main>

    <nav class="tabbar" aria-label="底部导航">
      <button class="tab-active" data-tab="home" type="button"><span aria-hidden="true">⌂</span>首页</button>
      <button data-tab="config" type="button"><span aria-hidden="true">⚙</span>配置</button>
      <button data-tab="logs" type="button"><span aria-hidden="true">≡</span>日志</button>
    </nav>

    <dialog class="success-dialog" id="successDialog">
      <div class="success-mark">✓</div><h2>抢到座位了</h2><p id="successText">请尽快确认预约状态。</p>
      <button class="primary" id="closeSuccessBtn" type="button">知道了</button>
    </dialog>
    <script src="./script.js"></script>
  </body>
</html>
