<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>登录 - gotolibray</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-brand reveal-item">
        <span class="brand-mark large">GO</span>
        <p class="eyebrow">我去图书馆</p>
        <h1>gotolibray</h1>
        <p>安静等待，及时出发。</p>
        <div class="auth-status"><i></i>服务运行中</div>
      </section>
      <section class="auth-panel reveal-item">
        <header><p class="eyebrow">WELCOME BACK</p><h2>登录账号</h2><p>继续管理你的头发与抢座配置。</p></header>
        <form class="form" id="loginForm">
          <label><span>用户名</span><input id="usernameInput" autocomplete="username" required autofocus placeholder="输入用户名" /></label>
          <label><span>密码</span><input id="passwordInput" type="password" autocomplete="current-password" required placeholder="输入密码" /></label>
          <button class="primary" id="loginBtn" type="submit">登录</button>
        </form>
        <p class="auth-message" id="messageBox" aria-live="polite"></p>
        <p class="auth-switch">还没有账号？<a href="/register.html">立即注册</a></p>
      </section>
    </main>
    <script src="./auth.js"></script>
  </body>
</html>
